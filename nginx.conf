server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    # Keep the public origin when HTTPS terminates at the reverse proxy.
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache" always;

    location = / {
        return 301 /es/$is_args$args;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
