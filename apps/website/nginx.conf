worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        absolute_redirect off;
        error_page 404 /404.html;

        location = / { return 301 /es/$is_args$args; }
        location = /about { return 301 /es/sobre-mosa/$is_args$args; }
        location = /about/ { return 301 /es/sobre-mosa/$is_args$args; }
        location = /collection { return 301 /es/coleccion/$is_args$args; }
        location = /collection/ { return 301 /es/coleccion/$is_args$args; }
        location = /visit { return 301 /es/visita/$is_args$args; }
        location = /visit/ { return 301 /es/visita/$is_args$args; }
        location = /events { return 301 /es/eventos/$is_args$args; }
        location = /events/ { return 301 /es/eventos/$is_args$args; }
        location = /resources { return 301 /es/recursos/$is_args$args; }
        location = /resources/ { return 301 /es/recursos/$is_args$args; }
        location = /contact { return 301 /es/contacto/$is_args$args; }
        location = /contact/ { return 301 /es/contacto/$is_args$args; }

        # Publication changes must be checked against the current origin response.
        location = /collection-snapshot.json {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }
        location ~ ^/(es/(coleccion|visita)|en/(collection|visit))/ {
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ =404;
        }
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
