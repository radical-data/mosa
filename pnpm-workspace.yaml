packages:
  - "."
  - "apps/*"
  - "packages/*"

engineStrict: true
nodeVersion: 24.18.0
minimumReleaseAge: 1440

# Supply-chain policy: intentionally explicit even where matching pnpm defaults.
blockExoticSubdeps: true
strictDepBuilds: true

allowBuilds:
  esbuild@0.28.1: true
  lefthook@2.1.10: true

overrides:
  # Temporary: Astro is exact-pinned to 7.0.9 in both apps because 7.1.x
  # was published within the minimumReleaseAge window and failed install.
  # Prefer a ranged Astro dependency again once a release clears the age gate
  # and is verified.
  #
  # Temporary: Astro 7.0.9 depends on obug ^2.1.1, which resolved to 2.1.4
  # within the minimumReleaseAge window and failed pnpm install.
  # Remove after an Astro release that depends on (or ships with) an
  # age-eligible obug, or after 2.1.4 clears the age gate and is verified.
  obug: 2.1.3

catalog:
  # Temporary: astro check does not yet recognise TypeScript 7.
  # Revisit when the upstream Astro language-tools issue is resolved.
  typescript: 6.0.3
  "@types/node": ^24.0.0
  "@types/pg": ^8.20.0
  pg: ^8.22.0
