name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the website and collection to the configured Coolify application
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Verify collection and website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: false
      - name: Restore published collection images only
        run: git lfs pull --include="collection/images/**" --exclude=""
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - name: Install dependencies
        run: mise x -- just install
      - name: Verify repository checks
        run: mise x -- just verify-checks
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Restore Astro image cache
        id: astro-image-cache
        uses: actions/cache@v4
        with:
          path: .astro-image-cache
          key: astro-images-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('Dockerfile', 'astro.config.mjs', 'package.json', 'src/**', 'collection/**', 'articles/**') }}
          restore-keys: |
            astro-images-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Attach Astro image cache to BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              ".astro-image-cache": {
                "target": "/app/node_modules/.astro/assets",
                "id": "astro-assets"
              }
            }
          skip-extraction: ${{ steps.astro-image-cache.outputs.cache-hit }}
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mosa-website:local
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
      - name: Check production HTTP behaviour
        run: |
          docker run --rm -d --name mosa-website-check -p 127.0.0.1:8080:8080 \
            mosa-website:local
          trap 'docker stop mosa-website-check' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/es/ >/dev/null; then break; fi
            sleep 1
          done
          mise x -- just http-test http://127.0.0.1:8080

  deploy:
    name: Deploy public website
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment: website-production
    concurrency:
      group: website-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: false
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - name: Install dependencies
        run: mise x -- just install
      - name: Require the current main commit
        run: |
          git fetch origin refs/heads/main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Deploy and verify the bundled collection
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: mise x -- just deploy
