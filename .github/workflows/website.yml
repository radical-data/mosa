name: Website

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'packages/public-collection/**'
      - 'scripts/publish-collection.ts'
      - 'scripts/lib/publication/**'
      - 'scripts/verify-collection-website.ts'
      - 'scripts/lib/verification-workspace.ts'
      - 'scripts/lib/run-command.ts'
      - 'apps/explorer/package.json'
      - 'biome.jsonc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - 'justfile'
      - '.dockerignore'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'apps/website/**'
      - 'packages/public-collection/**'
      - 'scripts/publish-collection.ts'
      - 'scripts/lib/publication/**'
      - 'scripts/verify-collection-website.ts'
      - 'scripts/lib/verification-workspace.ts'
      - 'scripts/lib/run-command.ts'
      - 'apps/explorer/package.json'
      - 'biome.jsonc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - 'justfile'
      - '.dockerignore'
      - '.github/workflows/website.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the website to its configured Coolify application
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Verify website and build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - name: Install dependencies
        run: mise x -- just install
      - name: Format and lint
        run: mise x -- just check
      - name: Check website
        run: mise x -- just website-check
      - name: Test localisation
        run: mise x -- pnpm --filter @mosa/website test
      - name: Verify populated and withdrawn collection output
        run: mise x -- just collection-website-verify
      - name: Build production image
        run: mise x -- just website-image
      - name: Check permanent redirects and error responses
        run: |
          docker run --rm -d --name mosa-website-check -p 127.0.0.1:8080:8080 mosa-website:local
          trap 'docker stop mosa-website-check' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/es/ >/dev/null; then break; fi
            sleep 1
          done
          mise x -- pnpm --filter @mosa/website test:http http://127.0.0.1:8080

  deploy:
    name: Deploy public website
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment: website-production
    concurrency:
      group: website-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - name: Install dependencies
        run: mise x -- just install
      - name: Require the current main commit
        run: |
          git fetch origin refs/heads/main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Deploy the currently authorised collection and verify served snapshot
        env:
          COLLECTION_DATABASE_URL: ${{ secrets.COLLECTION_DATABASE_URL }}
          COLLECTION_DATABASE_SSL_CA: ${{ secrets.COLLECTION_DATABASE_SSL_CA }}
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: mise x -- just collection deploy --snapshot apps/website/public/collection-snapshot.json
