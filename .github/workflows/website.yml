name: Website

on:
  push:
    branches: [main]
    paths: &website-paths
      - "src/**"
      - "public/**"
      - "collection/**"
      - ".gitattributes"
      - ".dockerignore"
      - "Dockerfile"
      - "nginx.conf"
      - "astro.config.mjs"
      - "scripts/deploy-website.ts"
      - "scripts/lib/website-deploy*"
      - "scripts/validate-collection.ts"
      - "scripts/validate-localisation.ts"
      - "scripts/verify-http.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "vitest.config.ts"
      - "justfile"
      - ".github/workflows/website.yml"
  pull_request:
    paths: *website-paths
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the website and collection to the configured Coolify application
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Verify website and build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with collection images
        uses: actions/checkout@v5
        with:
          lfs: false
      - name: Restore published collection images only
        run: git lfs pull --include="collection/images/**" --exclude=""
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - name: Install dependencies
        run: mise x -- just install
      - name: Verify repository
        run: mise x -- just verify
      - name: Build production image
        run: mise x -- just image
      - name: Check production HTTP behaviour
        run: |
          docker run --rm -d --name mosa-website-check -p 127.0.0.1:8080:8080 \
            mosa-website:local
          trap 'docker stop mosa-website-check' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8080/es/ >/dev/null; then break; fi
            sleep 1
          done
          mise x -- just http-test http://127.0.0.1:8080

  deploy:
    name: Deploy public website
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment: website-production
    concurrency:
      group: website-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout with collection images
        uses: actions/checkout@v5
        with:
          lfs: false
      - name: Restore published collection images only
        run: git lfs pull --include="collection/images/**" --exclude=""
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - name: Install dependencies
        run: mise x -- just install
      - name: Require the current main commit
        run: |
          git fetch origin refs/heads/main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Deploy and verify the bundled collection
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: mise x -- just deploy
