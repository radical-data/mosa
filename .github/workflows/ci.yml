name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify collection and website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with collection images
        uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0
      - name: Restore published collection images only
        run: git lfs pull --include="collection/images/**" --exclude=""

      - name: Install mise
        uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(mise x -- pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: mise x -- just install

      - name: Verify repository
        run: mise x -- just verify
